<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* إعدادات أساسية كانت تضيفها منصة Claude تلقائيا عند العرض */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>متابعة الحضور والغياب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: ledger-style monthly grid under a dark header band. The interface is ink on paper; colour is reserved for attendance state. */
:root{
  --paper:#F2F4F7;--surface:#FFFFFF;--zebra:#F8FAFC;--ink:#18243A;--ink-2:#44546A;--muted:#66758A;
  --line:#CBD3DE;--line-soft:#E4E9F0;--head:#18243A;--head-fg:#F2F4F7;--focus:#2B6CD4;
  --p-bg:#DCF1E3;--p-fg:#17703D;--a-bg:#FADADA;--a-fg:#B01E1E;--j-bg:#DAE8FA;--j-fg:#1F5CA6;--l-bg:#FAEBC0;--l-fg:#7E5200;
  --off:#E6EAF0;--hatch:#BAC4D1;--warn-bg:#FFF3D6;--warn-fg:#6B4A00;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic','Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E141D;--surface:#151D2A;--zebra:#192231;--ink:#E7ECF3;--ink-2:#B4BFCE;--muted:#8C99AB;
    --line:#2D394B;--line-soft:#222C3B;--head:#0A1018;--head-fg:#E7ECF3;--focus:#7FB0FF;
    --p-bg:#17392A;--p-fg:#74D6A0;--a-bg:#451D20;--a-fg:#FF9494;--j-bg:#1B3352;--j-fg:#94C0F7;--l-bg:#45360F;--l-fg:#F2C760;
    --off:#1C2536;--hatch:#3A485E;--warn-bg:#3F3210;--warn-fg:#F2D48A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141D;--surface:#151D2A;--zebra:#192231;--ink:#E7ECF3;--ink-2:#B4BFCE;--muted:#8C99AB;
  --line:#2D394B;--line-soft:#222C3B;--head:#0A1018;--head-fg:#E7ECF3;--focus:#7FB0FF;
  --p-bg:#17392A;--p-fg:#74D6A0;--a-bg:#451D20;--a-fg:#FF9494;--j-bg:#1B3352;--j-fg:#94C0F7;--l-bg:#45360F;--l-fg:#F2C760;
  --off:#1C2536;--hatch:#3A485E;--warn-bg:#3F3210;--warn-fg:#F2D48A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--f-body)}
.in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1680px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.nm:focus-visible,.sg:focus-visible,.drow:focus-visible,.cs:focus-visible,.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.band{background:var(--head);color:var(--head-fg);border-bottom:1px solid var(--line)}
.band .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.inst{font-size:12px;opacity:.75;letter-spacing:.03em}
h1{font:600 21px/1.3 var(--f-display);margin:2px 0 0;text-wrap:balance}
.who{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap}
.band .btn{background:transparent;color:var(--head-fg);border-color:rgba(255,255,255,.35)}
.band label.dd{display:flex;align-items:center;gap:6px;color:var(--head-fg);opacity:.85;font-size:12px}
.band input[type=date]{min-height:32px;padding:3px 7px;width:auto;background:transparent;color:var(--head-fg);border-color:rgba(255,255,255,.35)}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .in{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;color:var(--ink-2);padding:11px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
main{padding-block:16px 40px}

label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
select,input[type=text],input[type=search],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:38px;min-width:0;width:100%}
textarea{min-height:110px;resize:vertical}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:12px}
.ginfo{color:var(--ink-2);font-size:13px;margin:0 0 10px}
.sum{display:flex;flex-wrap:wrap;gap:4px 26px;margin:0 0 14px;padding:0}
.sum div{display:flex;gap:6px;align-items:baseline}
.sum dt{color:var(--muted);font-size:12px}
.sum dd{margin:0;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;margin-bottom:8px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:22px;border-radius:4px;display:inline-grid;place-items:center;font-weight:600;font-size:12px;position:relative}
.sw.sP{background:var(--p-bg);color:var(--p-fg)}.sw.sA{background:var(--a-bg);color:var(--a-fg)}
.sw.sJ{background:var(--j-bg);color:var(--j-fg)}.sw.sL{background:var(--l-bg);color:var(--l-fg)}
.sw.none{background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,var(--surface) 2px 6px);border:1px solid var(--line)}
.sw.off{background:var(--off);color:var(--muted)}
.sw.mx::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:5px;height:5px;border-radius:50%;background:currentColor}
.rule{font-size:12px;color:var(--muted);margin:8px 0 0}
.foot{font-size:12px;color:var(--muted);margin:10px 0 0}

.tw{overflow:auto;max-height:min(74vh,860px);border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw.free{max-height:none}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content}
.g th,.g td{border-bottom:1px solid var(--line-soft);border-inline-start:1px solid var(--line-soft);padding:0;text-align:center;height:40px}
.g thead th{position:sticky;top:0;z-index:3;background:var(--surface);font-weight:500;font-size:12px;height:46px;border-bottom:1px solid var(--line)}
.g thead th.c-name{z-index:5;text-align:start;padding-inline:10px;font-weight:600}
.g tbody tr{--row-bg:var(--surface)}
.g tbody tr:nth-child(even){--row-bg:var(--zebra)}
.g tbody td{background:var(--row-bg)}
.c-name{position:sticky;right:0;z-index:2;min-width:168px;max-width:168px;text-align:start;padding:3px 10px;box-shadow:inset 1px 0 0 var(--line)}
.g tbody td.c-name{text-align:start;padding:3px 10px}
.nm{all:unset;cursor:pointer;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:148px;line-height:1.35}
.nm:hover{text-decoration:underline}
.nm.wide{max-width:none;display:inline}
.rg{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
.sth{min-width:44px;width:44px;line-height:1.2;padding-inline:2px}
.stc{font-variant-numeric:tabular-nums;font-weight:600}
.c-P{color:var(--p-fg)}.c-A{color:var(--a-fg)}.c-J{color:var(--j-fg)}.c-L{color:var(--l-fg)}.c-N,.c-R,.c-K,.c-D{color:var(--ink-2)}
.stc.z{font-weight:400;opacity:.45}
.stc.hi{background:var(--a-bg)!important;color:var(--a-fg)}
.stc.ea{background:var(--l-bg)!important;color:var(--l-fg)}
.stc.lowr{color:var(--a-fg)}
.dh,.d{min-width:38px;width:38px}
.dh .dn{display:block;font-size:10px;color:var(--muted);line-height:1.2}
.dh .dd{display:block;font-size:13px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.g thead th.offh{background:var(--off)}
.g thead th.tdy{box-shadow:inset 0 -3px 0 var(--focus)}
.d{font-weight:700;font-size:13px;position:relative}
.g td.d.sP{background:var(--p-bg);color:var(--p-fg)}
.g td.d.sA{background:var(--a-bg);color:var(--a-fg)}
.g td.d.sJ{background:var(--j-bg);color:var(--j-fg)}
.g td.d.sL{background:var(--l-bg);color:var(--l-fg)}
.g td.d.none{background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,var(--row-bg) 2px 6px)}
.g td.d.off{background:var(--off);color:var(--muted);font-weight:500;font-size:12px}
.d.mx::after{content:"";position:absolute;top:5px;inset-inline-end:5px;width:6px;height:6px;border-radius:50%;background:currentColor}
.d[data-t]{cursor:pointer}
.d[data-t]:hover{outline:2px solid var(--focus);outline-offset:-2px}
.tw.dense .dh,.tw.dense .d{min-width:28px;width:28px}
.tw.dense table.g td,.tw.dense table.g th{height:32px}
.tw.dense .g thead th{height:42px}
.tw.dense .d{font-size:12px}
.tw.dense .dh .dn{font-size:9px}
.tw.dense .dh .dd{font-size:12px}
.tw.dense .sth{min-width:40px;width:40px;font-size:11px}
.tw.dense .c-name{min-width:152px;max-width:152px}
.tw.dense .nm{max-width:132px;font-size:12.5px}
.tw.dense .rg{font-size:10.5px}
.g tbody tr.gh td{background:var(--off);font-weight:700;font-size:12px;height:30px;padding:0 10px;text-align:start;color:var(--ink)}
.g tbody tr.gh td.ghi{font-weight:500;color:var(--ink-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.ph{display:none}

.t2{width:100%;border-collapse:collapse;font-size:13px}
.t2 th,.t2 td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:middle}
.t2 th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface);border-bottom:1px solid var(--line)}
.t2 td.n{font-variant-numeric:tabular-nums}
.t2 .lowr{color:var(--a-fg);font-weight:700}
.t2 td.wrap{white-space:normal}
.sec{margin-top:22px}
.sec h2{font-size:16px;margin:0 0 2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.cols>*{min-width:0}

.login{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:760px;margin-top:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;align-content:start}
.panel h2{margin:0;font-size:16px}
.panel p{margin:0;color:var(--ink-2)}
.note-demo{background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:9px 12px;font-size:13px;max-width:760px;margin:14px 0 0}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:9px 12px;font-size:13px;margin:0 0 10px}
.nt{color:var(--ink-2);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.P{background:var(--p-bg);color:var(--p-fg)}.pill.A{background:var(--a-bg);color:var(--a-fg)}
.pill.J{background:var(--j-bg);color:var(--j-fg)}.pill.L{background:var(--l-bg);color:var(--l-fg)}
.pill.N{background:var(--off);color:var(--ink-2)}

.dnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.dnav .cur{font-weight:700;font-size:16px;padding-inline:4px}
.scards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.scard{display:grid;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;align-content:start}
.scard .tm{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.scard .sj{font-weight:600;font-size:16px;line-height:1.4}
.scard .gp{color:var(--ink-2);font-size:13px}
.scard .btn{min-height:44px}
.scard .st{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.erow .rn b{display:block;font-weight:600}
.erow .en{grid-column:1/-1}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.sg{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:5px 12px;border-radius:6px;min-height:40px;min-width:56px;cursor:pointer;font-size:13px}
.sg[aria-pressed="true"]{font-weight:700}
.sg.P[aria-pressed="true"]{background:var(--p-bg);color:var(--p-fg);border-color:var(--p-fg)}
.sg.A[aria-pressed="true"]{background:var(--a-bg);color:var(--a-fg);border-color:var(--a-fg)}
.sg.J[aria-pressed="true"]{background:var(--j-bg);color:var(--j-fg);border-color:var(--j-fg)}
.sg.L[aria-pressed="true"]{background:var(--l-bg);color:var(--l-fg);border-color:var(--l-fg)}
.sbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:8px}
.ehead{display:grid;gap:2px;margin-bottom:10px}
.ehead h2{margin:0;font-size:18px}
.cs{all:unset;cursor:pointer;display:grid;gap:4px;padding:8px 10px;border-radius:6px;min-width:150px;box-sizing:border-box}
.cs:hover{background:var(--zebra)}
.cs .sjt{font-weight:600;white-space:normal}

.mo{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(600px,100%);max-height:100%;overflow:auto}
.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.dlg h2{margin:0;font-size:17px}
.dlg .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.dlg .bd{padding:14px 16px;display:grid;gap:12px}
.dlg footer{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line-soft)}
.srow{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.srow:last-child{border-bottom:0;padding-bottom:0}
.sl{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line-soft);background:none;color:var(--ink);padding:9px 2px;cursor:pointer}
.drow:hover{background:var(--zebra)}
.drow .ss{font-weight:700;letter-spacing:.12em;color:var(--ink-2)}
textarea.cp{width:100%;min-height:180px;font:12px/1.5 ui-monospace,monospace;direction:ltr}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;white-space:pre-wrap;line-height:1.9;font-size:14px}
.toast{position:fixed;inset-inline:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500}
@media(max-width:640px){
  h1{font-size:17px}
  .c-name{min-width:132px;max-width:132px}
  .nm{max-width:112px}
  .tw{max-height:70vh}
  .erow{grid-template-columns:minmax(0,1fr)}
  .sg{flex:1}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;color:#000}
  .band,.tabs,.filters,.bar,.foot,.rule,.toast,#modal,.ginfo{display:none!important}
  .ph{display:block;margin:0 0 6px;font-size:12px}
  .in{max-width:none;padding:0}
  .tw,.tw.dense{overflow:visible;max-height:none;border:0}
  table.g{font-size:9px;width:100%}
  .g thead th,.c-name{position:static!important}
  .g thead{display:table-header-group}
  .g tr{break-inside:avoid}
  .dh,.d{min-width:0!important;width:auto!important}
  .c-name{min-width:110px!important;max-width:110px!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="modal" class="mo" dir="rtl" lang="ar" hidden></div>
<div id="toast" class="toast" dir="rtl" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
document.documentElement.dir='rtl';document.documentElement.lang='ar';

/* ================= constants ================= */
const INST='المعهد الوطني المتخصص في التكوين المهني';
const MONTHS=['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DOW=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DOWS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const SYM={P:'ح',A:'غ',J:'م',L:'ت'};
const LBL={P:'حاضر',A:'غائب',J:'غائب بمبرر',L:'متأخر',N:'غير مسجل'};
const ORDER=['A','J','L','P'];
const SLOTS=[{n:1,t:'08:00 – 10:00'},{n:2,t:'10:15 – 12:00'},{n:3,t:'13:00 – 14:30'},{n:4,t:'14:30 – 16:00'}];
const HOL={'01-01':'رأس السنة الميلادية','01-12':'رأس السنة الأمازيغية','05-01':'عيد العمال','07-05':'عيد الاستقلال','11-01':'ذكرى اندلاع الثورة'};
const SEM_START='2026-10-04',SEM_END='2027-02-13';
const MONTH_LIST=[{y:2026,m:9},{y:2026,m:10},{y:2026,m:11},{y:2027,m:0},{y:2027,m:1}];
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
function dayObj(s){const p=s.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);return{iso:s,n:p[2],dow:dt.getDay(),md:pad(p[1])+'-'+pad(p[2]),y:p[0],m:p[1]-1};}
function monthDays(y,m){const n=new Date(y,m+1,0).getDate(),a=[];for(let d=1;d<=n;d++)a.push(dayObj(iso(y,m,d)));return a;}
const longDate=o=>DOW[o.dow]+' '+o.n+' '+MONTHS[o.m]+' '+o.y;
const shortDate=s=>{const o=dayObj(s);return o.n+' '+MONTHS[o.m];};
const NOW=new Date();
const REAL=iso(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const ANCHOR=REAL<SEM_START?SEM_START:REAL>SEM_END?SEM_END:REAL;

const SEM_DATES=[];

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=hash(seed);return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

});

/* ================= attendance engine ================= */
const GC=new Map(),SC=new Map();
function bust(){SC.clear();}
function sessMissing(gid,date,s){return rng('sm'+gid+date+s)()<0.03;}
function genDay(t,date){
  const key=t.id+'|'+date;
  if(GC.has(key))return GC.get(key);
  let out=null;
  const g=GMAP[t.g];
  if(!t.imp&&date<ANCHOR&&date>=SEM_START&&!(t.from&&date<t.from)){
    const d=dayObj(date);
    if(g.days.includes(d.dow)&&!HOL[d.md]){
      const r=rng('td'+t.id+date),fn=FORCE[t.id]||0;
      const forced=fn>0&&g.hist.slice(-fn).includes(date);
      const absDay=forced||r()<t.pAbs;
      const just=!forced&&r()<0.35;
      const leave=!forced&&r()<0.12;
      const noteJ=NOTES_J[Math.floor(r()*NOTES_J.length)];
      out=[null,null,null,null];
      for(let s=1;s<=4;s++){
        if(sessMissing(g.id,date,s))continue;
        let st='P',note='';
        if(absDay){
          if(leave&&s===1)st='P';
          else if(just){st='J';note=noteJ;}
          else st='A';
        }else{
          const x=r();
          if(x<0.03){st='L';note=NOTES_L[Math.floor(r()*NOTES_L.length)];}
          else if(x<0.04)st='A';
        }
        out[s-1]={st,note};
      }
    }
  }
  GC.set(key,out);
  return out;
}
function dayRec(t,date){
  const gd=genDay(t,date),ed=STORE.edits[t.id+'|'+date],out=[];
  for(let s=1;s<=4;s++){let x=gd?gd[s-1]:null;if(ed&&ed[s])x=ed[s];out.push(x);}
  return out;
}
function dayInfo(t,d){
  const g=GMAP[t.g];
  if(d.iso<SEM_START||d.iso>SEM_END)return{k:'off'};
  if(t.from&&d.iso<t.from)return{k:'out'};
  if(HOL[d.md])return{k:'hol',name:HOL[d.md]};
  if(!g.days.includes(d.dow))return{k:'off'};
  if(d.iso>S.today)return{k:'future'};
  const rec=dayRec(t,d.iso),got=rec.filter(Boolean);
  if(!got.length)return{k:'none'};
  const sts=got.map(x=>x.st);
  return{k:'rec',st:ORDER.find(x=>sts.includes(x)),mixed:new Set(sts).size>1||got.length<4,rec};
}
function isAbsDay(rec){const a=rec.filter(x=>x&&x.st==='A').length;return STORE.rules.dayRule==='all'?a===4:a>=1;}
function tally(t,days){
  const c={P:0,A:0,J:0,L:0,dA:0,N:0};
  const infos=days.map(d=>{
    const i=dayInfo(t,d);
    if(i.k==='rec'){i.rec.forEach(x=>{if(x)c[x.st]++;});if(isAbsDay(i.rec))c.dA++;}
    else if(i.k==='none')c.N++;
    return i;
  });
  const den=c.P+c.L+c.A+c.J;
  return{infos,c,rate:den?(c.P+c.L)/den:null};
}
function streakOf(t){
  if(SC.has(t.id))return SC.get(t.id);
  const g=GMAP[t.g];
  let run=0,dates=[],max=0,total=0;
  for(const date of g.dates){
    if(date>S.today)break;
    if(t.from&&date<t.from)continue;
    const i=dayInfo(t,dayObj(date));
    if(i.k!=='rec')continue;
    if(isAbsDay(i.rec)){run++;dates.push(date);total++;if(run>max)max=run;}
    else{run=0;dates=[];}
  }
  const need=STORE.rules.consec;
  const state=run>=need?'warn':(run>=1&&run===need-1)?'early':'ok';
  const res={cur:run,dates:dates.slice(),start:dates[0]||null,max,total,state};
  SC.set(t.id,res);
  return res;
}
const sentKey=(t,sk)=>t.id+'|'+sk.start;

/* ================= sessions ================= */
const rosterOf=(gid,date)=>GT[gid].filter(t=>!(t.from&&date<t.from));
function sessionsOn(date){
  const d=dayObj(date);
  if(date<SEM_START||date>SEM_END||HOL[d.md])return[];
  const out=[];
  GROUPS.forEach(g=>{if(g.tt[d.dow])out.push({g,tt:g.tt[d.dow]});});
  return out;
}
function tSessions(tid,date){
  const out=[];
  sessionsOn(date).forEach(x=>x.tt.forEach(e=>{if(e.teacher===tid)out.push({g:x.g,e});}));
  out.sort((a,b)=>a.e.slot-b.e.slot||a.g.no-b.g.no);
  return out;
}
const TDC={};
function teacherDates(tid){
  if(!TDC[tid])TDC[tid]=SEM_DATES.filter(d=>tSessions(tid,d).length>0);
  return TDC[tid];
}
function sessSum(gid,date,slot){
  const r=rosterOf(gid,date),c={P:0,A:0,L:0,J:0,rec:0,n:r.length};
  r.forEach(t=>{const x=dayRec(t,date)[slot-1];if(x){c.rec++;c[x.st]++;}});
  return c;
}
function sessRecorded(gid,date,slot){
  for(const t of GT[gid]){if(t.from&&date<t.from)continue;if(dayRec(t,date)[slot-1])return true;}
  return false;
}
function missingPast(){
  const out=[];
  GROUPS.forEach(g=>{
    g.dates.forEach(date=>{
      if(date>=S.today)return;
      g.tt[dayObj(date).dow].forEach(e=>{if(!sessRecorded(g.id,date,e.slot))out.push({g,date,e});});
    });
  });
  out.sort((a,b)=>b.date.localeCompare(a.date)||a.g.no-b.g.no||a.e.slot-b.e.slot);
  return out;
}
function sessPill(date,c){
  if(c.rec>0)return `<span class="pill P">سُجّلت</span> <span class="nt">غائب ${c.A} · متأخر ${c.L}${c.J?' · مبرر '+c.J:''}</span>`;
  if(date>S.today)return '<span class="pill N">لم تحن بعد</span>';
  if(date===S.today)return '<span class="pill L">لم تُسجَّل بعد</span>';
  return '<span class="pill A">لم تُسجَّل</span>';
}
function canEdit(gid,date,slot){
  if(date>S.today)return false;
  if(S.user.role==='admin')return true;
  const e=(GMAP[gid].tt[dayObj(date).dow]||[]).find(x=>x.slot===slot);
  return !!e&&e.teacher===S.user.id&&date===S.today;
}

  roster.forEach(t=>{const s=e.draft[t.id].st;if(s==='A')a++;else if(s==='L')l++;else if(s==='J')j++;else p++;});
  const opts=admin?['P','A','L','J']:['P','A','L'];
  let reason='';
  if(!can){reason=e.date>S.today?'لم يحن موعد هذه الحصة بعد.':'العرض فقط. التعديل بعد انتهاء اليوم من صلاحية المدير.';}
  const rows=roster.map(t=>{
    const x=e.draft[t.id],locked=!admin&&x.st==='J';

    else if(locked)ctrl='<span class="pill J">مبرر من المدير</span>';
    else ctrl=segHtml(x.st,`data-act="eset" data-t="${t.id}"`,opts);

      else if(x.note)note=`<div class="en nt">${esc(x.note)}</div>`;
    }
    return `<div class="erow"><div class="rn"><b>${esc(fullName(t))}</b><span class="rg">${t.reg}</span></div>${ctrl}${note}</div>`;
  }).join('');
  $('#view').innerHTML=`<p><button class="btn" data-act="eback">‹ رجوع</button></p>
  <div class="ehead"><h2>${esc(ent.subj)}</h2><div class="nt">الحصة ${e.slot} · ${SLOTS[e.slot-1].t} · ${longDate(d)}</div><div class="nt">${esc(gLabel(g))} · ${esc(TNAME[ent.teacher])}</div></div>
  ${reason?`<p class="warn">${reason}</p>`:''}
  ${e.err?`<p class="warn" role="alert">${esc(e.err)}</p>`:''}
  ${none?'<p class="warn">لم تُسجَّل هذه الحصة.</p>':`<p class="ginfo">حاضر ${p} · غائب ${a} · متأخر ${l}${j?' · مبرر '+j:''} · من ${roster.length}</p>`}
  <section class="panel">${rows}</section>
  ${can?`<div class="sbar"><button class="btn" data-act="eall">الكل حاضر</button><button class="btn pri" data-act="esave">حفظ الحصة</button></div>`:''}`;
}
function saveEditor(){
  const e=S.edit,g=GMAP[e.gid],d=dayObj(e.date),ent=g.tt[d.dow].find(x=>x.slot===e.slot),roster=rosterOf(e.gid,e.date);
  let first=true,a=0,l=0,j=0;const changes=[];
  const prev={};
  roster.forEach(t=>{const p=dayRec(t,e.date)[e.slot-1];prev[t.id]=p;if(p)first=false;});
  roster.forEach(t=>{
    const n=e.draft[t.id],k=t.id+'|'+e.date,ed=STORE.edits[k]||{};
    ed[e.slot]={st:n.st,note:n.st==='P'?'':(n.note||'')};
    STORE.edits[k]=ed;
    if(n.st==='A')a++;else if(n.st==='L')l++;else if(n.st==='J')j++;
    const p=prev[t.id];
    if(p&&p.st!==n.st)changes.push(`${fullName(t)} — ${esc2(ent.subj)} (${gLabel(g)}، ${shortDate(e.date)}، الحصة ${e.slot}): من «${LBL[p.st]}» إلى «${LBL[n.st]}»`);
  });
  const what=`${gLabel(g)} · ${shortDate(e.date)} · الحصة ${e.slot} (${ent.subj})`;
  if(first)addLog(`سجّل الحصة: ${what} — غائب ${a}، متأخر ${l}${j?'، مبرر '+j:''}`);
  else changes.forEach(c=>addLog('عدّل: '+c));
  persist();bust();
  const changed=first||changes.length>0;
  S.edit=null;renderView();
  toast(changed?'تم حفظ الحصة':'لا يوجد تغيير');
}
function esc2(s){return String(s);}

function periodSelect(id){

function visibleTrainees(){
  const q=norm(S.q.trim());
  return TRAINEES.filter(t=>{
    const g=GMAP[t.g];
    if(q)return norm(t.reg+' '+t.last+' '+t.first+' | '+t.first+' '+t.last).includes(q);

function ghRow(gid,data,span){
  const g=GMAP[gid],rs=data.filter(r=>r.t.g===gid);

  return `<tr class="gh"><td class="c-name">${esc(SMAP[g.spec].short)} ف${g.no}</td><td colspan="${span}" class="ghi">${rs.length} متربصًا · ${daysText(g)} · نسبة الحضور ${den?Math.round(p/den*100)+'%':'—'} · إنذارات: ${al}</td></tr>`;

function cellHtml(t,i,d){
  const a=` data-t="${t.id}" data-d="${d.iso}"`;
  if(i.k==='rec')return `<td class="d s${i.st}${i.mixed?' mx':''}"${a}>${SYM[i.st]}</td>`;
  if(i.k==='none')return `<td class="d none"${a}></td>`;
  if(i.k==='hol')return `<td class="d off" title="${esc(i.name)}">ع</td>`;
  if(i.k==='out')return `<td class="d off" title="قبل الالتحاق">–</td>`;

function updateGrid(){
  const days=monthDays(S.year,S.month);
  const list=visibleTrainees();
  let data=list.map(t=>Object.assign({t},tally(t,days),{sk:streakOf(t)}));
  if(S.only==='alert')data=data.filter(r=>r.sk.state!=='ok');
  else if(S.only==='none')data=data.filter(r=>r.c.N>0);
  const gIdx={};GROUPS.forEach((g,i)=>{gIdx[g.id]=i;});
  data.sort((a,b)=>{
    const d=gIdx[a.t.g]-gIdx[b.t.g];if(d)return d;
    if(S.sort==='abs')return b.c.dA-a.c.dA||b.c.A-a.c.A;
    if(S.sort==='rate')return (a.rate===null?2:a.rate)-(b.rate===null?2:b.rate);
    if(S.sort==='streak')return b.sk.cur-a.sk.cur;
    return 0;
  });
  const gset=new Set(data.map(r=>r.t.g)),multi=gset.size>1;
  const single=(!S.q.trim()&&S.group!=='all')?GMAP[S.group]:null;

  const studyDows=new Set();gset.forEach(id=>GMAP[id].days.forEach(x=>studyDows.add(x)));
  const cols=S.hideOff?days.filter(d=>d.iso>=SEM_START&&d.iso<=SEM_END&&studyDows.has(d.dow)):days;
  const idx=new Map(days.map((d,i)=>[d.iso,i]));
  const tot={P:0,A:0,J:0,L:0,N:0,dA:0};
  data.forEach(r=>{for(const k in tot)tot[k]+=r.c[k];});
  const den=tot.P+tot.L+tot.A+tot.J;
  const nWarn=data.filter(r=>r.sk.state==='warn').length,nEarly=data.filter(r=>r.sk.state==='early').length;
  const legend=`<div class="leg" aria-label="مفتاح الألوان">

    <span class="lg"><span class="sw sJ">م</span>غائب بمبرر</span><span class="lg"><span class="sw sL">ت</span>متأخر</span>
    <span class="lg"><span class="sw none"></span>غير مسجل</span><span class="lg"><span class="sw off">ع</span>عطلة</span>
    <span class="lg"><span class="sw sP mx"></span>حصص بحالات مختلفة أو ناقصة</span></div>`;
  const stats=[['D','أيام غياب'],['A','حصص غياب'],['L','تأخر'],['J','مبرر'],['R','النسبة'],['K','متتالي']];
  const stath=stats.map(x=>`<th class="sth c-${x[0]}" scope="col">${x[1]}</th>`).join('');
  const dh=cols.map(d=>{
    const off=!!HOL[d.md]||(single?!single.days.includes(d.dow):false);
    return `<th class="dh${off?' offh':''}${d.iso===S.today?' tdy':''}" scope="col"><span class="dn">${DOWS[d.dow]}</span><span class="dd">${d.n}</span></th>`;
  }).join('');
  let lastG=null;
  const rows=data.map(r=>{
    const t=r.t,g=GMAP[t.g],c=r.c;let gh='';
    if(multi&&lastG!==t.g){lastG=t.g;gh=ghRow(t.g,data,cols.length+stats.length);}
    const tag=multi?` · ${esc(SMAP[g.spec].short)} ف${g.no}`:'';
    const z=v=>v===0?' z':'';
    const kcls=r.sk.state==='warn'?' hi':r.sk.state==='early'?' ea':(r.sk.cur===0?' z':'');
    const st=`<td class="stc c-D${z(c.dA)}">${c.dA}</td><td class="stc c-A${z(c.A)}">${c.A}</td><td class="stc c-L${z(c.L)}">${c.L}</td><td class="stc c-J${z(c.J)}">${c.J}</td>
      <td class="stc c-R${r.rate!==null&&r.rate<0.8?' lowr':''}">${r.rate===null?'—':Math.round(r.rate*100)+'%'}</td><td class="stc c-K${kcls}">${r.sk.cur}</td>`;
    return gh+`<tr><td class="c-name"><button class="nm" data-ot="${t.id}" title="${esc(fullName(t))}">${esc(fullName(t))}</button><span class="rg">${t.reg}${tag}</span></td>${st}${cols.map(d=>cellHtml(t,r.infos[idx.get(d.iso)],d)).join('')}</tr>`;
  }).join('');
  const dense=cols.length>16;
  const table=data.length&&cols.length?`<div class="tw${dense?' dense':''}" tabindex="0" aria-label="جدول الحضور الشهري"><table class="g"><caption class="sr">جدول الحضور والغياب لشهر ${MONTHS[S.month]} ${S.year}</caption>

    :`<div class="tw free"><p class="empty">لا توجد نتائج لهذا الاختيار.</p></div>`;
  S._data={cols,data,idx};
  $('#gridArea').innerHTML=`<div class="ph"><strong>${INST}</strong><br>المتابعة الشهرية للحضور والغياب — ${MONTHS[S.month]} ${S.year}${single?' — '+esc(gLabel(single)):''}</div>

    <div><dt>في الإنذار</dt><dd>${nWarn}</dd></div><div><dt>قريبون من الإنذار</dt><dd>${nEarly}</dd></div><div><dt>أيام غير مسجلة</dt><dd>${tot.N}</dd></div></dl>

    <p class="foot">الطباعة والتصدير المباشر إلى Excel وPDF تتوفر في النسخة الحقيقية. هنا يمكنك نسخ الجدول ولصقه في Excel.</p>`;
}
function buildTSV(){
  const D=S._data;
  const head=['رقم التسجيل','اللقب والاسم','التخصص','الفوج','أيام غياب','حصص غياب','تأخر','مبرر','نسبة الحضور','متتالي'].concat(D.cols.map(d=>d.n));
  const rows=D.data.map(r=>{
    const g=GMAP[r.t.g];
    return [r.t.reg,fullName(r.t),SMAP[g.spec].name,g.name,r.c.dA,r.c.A,r.c.L,r.c.J,r.rate===null?'':Math.round(r.rate*100)+'%',r.sk.cur]
      .concat(D.cols.map(d=>{const i=r.infos[D.idx.get(d.iso)];return i.k==='rec'?SYM[i.st]:i.k==='none'?'؟':'';}));
  });
  return [head].concat(rows).map(r=>r.join('\t')).join('\n');
}
function copyTable(){

function doImport(){
  const g=GMAP[S.imp.g],lines=S.imp.txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length){S.imp.msg='القائمة فارغة.';return renderSettings();}
  const have=new Set(TRAINEES.map(t=>t.reg));let added=0,dup=0,bad=0;
  lines.forEach((ln,i)=>{
    const parts=ln.split(/\t|;/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2){bad++;return;}
    const reg=parts[0],words=parts[1].split(/\s+/);
    if(have.has(reg)){dup++;return;}
    const t={id:'x'+Date.now().toString(36)+i,g:g.id,reg,last:words[0],first:words.slice(1).join(' ')||'—',from:S.today};
    STORE.extra.push(t);const o=Object.assign({imp:true,pAbs:0},t);TRAINEES.push(o);TMAP[o.id]=o;have.add(reg);added++;
  });
  rebuildIdx();bust();
  if(added)addLog(`استورد ${added} متربصًا إلى ${gLabel(g)}`);
  persist();
  S.imp.msg=`أُضيف ${added} متربصًا${dup?'، تجاهلنا '+dup+' برقم تسجيل مكرر':''}${bad?'، وتعذّر قراءة '+bad+' سطرًا (يلزم رقم التسجيل ثم الاسم)':''}.`;
  if(added)S.imp.txt='';
  renderSettings();
}
function doReset(){
  for(let i=TRAINEES.length-1;i>=0;i--)if(TRAINEES[i].imp){delete TMAP[TRAINEES[i].id];TRAINEES.splice(i,1);}
  STORE.edits={};STORE.log=[];STORE.sent={};STORE.extra=[];
  rebuildIdx();bust();persist();S.arm=false;S.imp.msg='';
  renderSettings();toast('أُعيد ضبط البيانات التجريبية');
}

    if(a==='sgo'){S.sd=ds.d;return renderSessions();}
    if(a==='eback'){S.edit=null;return renderView();}
    if(a==='eset'){
      const x=S.edit.draft[ds.t];x.st=ds.v;if(ds.v==='P')x.note='';S.edit.err='';
      renderEditor();
      const b=document.querySelector(`.sg[data-t="${ds.t}"][data-v="${ds.v}"]`);if(b)b.focus({preventScroll:true});return;
    }
    if(a==='eall'){rosterOf(S.edit.gid,S.edit.date).forEach(t=>{const x=S.edit.draft[t.id];if(!(S.user.role!=='admin'&&x.st==='J')){x.st='P';x.note='';}});return renderEditor();}
    if(a==='esave')return saveEditor();
    if(a==='justify'){
      const t=TMAP[ds.t],note=(($('#j-note')||{}).value||'').trim(),k=t.id+'|'+ds.d,ed=STORE.edits[k]||{};let n=0;
      dayRec(t,ds.d).forEach((x,i)=>{if(x&&x.st==='A'){ed[i+1]={st:'J',note};n++;}});
      STORE.edits[k]=ed;
      addLog(`برّر غياب ${fullName(t)} يوم ${shortDate(ds.d)} (${n} ${n===1?'حصة':'حصص'})${note?': '+note:''}`);
      persist();bust();MS=[];renderModal();afterChange();return toast('تم تبرير غيابات اليوم');
    }
    if(a==='letter')return(MS.push({type:'letter',tid:ds.t}),renderModal());
    if(a==='copy-letter'){const t=TMAP[ds.t];return copyText(letterText(t,streakOf(t)),'تم نسخ نص الإعذار');}
    if(a==='mark-sent'){
      const t=TMAP[ds.t],sk=streakOf(t);
      STORE.sent[sentKey(t,sk)]={date:S.today};
      addLog(`سجّل إرسال إعذار الغياب إلى ${fullName(t)} (${sk.cur} أيام متتالية)`);
      persist();renderModal();afterChange();return toast('سُجّل إرسال الإعذار');
    }
    if(a==='import')return doImport();
    if(a==='reset'){
      if(!S.arm){S.arm=true;renderSettings();setTimeout(()=>{if(S.arm){S.arm=false;if(S.user&&!S.edit&&S.tab==='settings')renderSettings();}},4000);return;}
      return doReset();
    }
    return;
  }
  if(e.target===modal)return popModal();
  const nm=e.target.closest('[data-ot]');
  if(nm)return(MS=[{type:'detail',tid:nm.dataset.ot}],renderModal());
  const td=e.target.closest('td.d[data-t]');
  if(td)return(MS=[{type:'cell',tid:td.dataset.t,date:td.dataset.d}],renderModal());
});
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;if(!id)return;
  if(id==='demo-date'){
    if(!v)return;
    S.today=v;S.tdate=v;S.sd=null;S.edit=null;bust();
    const o=dayObj(v);S.year=o.y;S.month=o.m;
    return renderShell();
  }
  if(id==='f-month'||id==='o-month'){const p=v.split('-').map(Number);S.year=p[0];S.month=p[1];return id==='o-month'?renderOverview():updateGrid();}
  if(id==='f-spec'){S.spec=v;S.group='all';renderFilters();return updateGrid();}
  if(id==='f-group'){S.group=v;renderFilters();return updateGrid();}
  if(id==='f-only'){S.only=v;return updateGrid();}
  if(id==='f-sort'){S.sort=v;return updateGrid();}
  if(id==='f-days'){S.hideOff=v==='1';return updateGrid();}
  if(id==='w-spec'){S.wspec=v;S.wgroup='all';return renderWarn();}
  if(id==='w-group'){S.wgroup=v;return renderWarn();}
  if(id==='w-show'){S.wshow=v;return renderWarn();}
  if(id==='s-date'){if(v){S.sd=v;renderSessions();}return;}
  if(id==='r-consec'){STORE.rules.consec=+v;persist();bust();return renderSettings();}
  if(id==='r-day'){STORE.rules.dayRule=v;persist();bust();return renderSettings();}
  if(id==='tt-g'){S.ttg=v;return renderSettings();}
  if(id==='imp-g'){S.imp.g=v;return;}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='f-q'){S.q=el.value;return updateGrid();}
  if(el.id==='imp-t'){S.imp.txt=el.value;return;}
  if(el.dataset&&el.dataset.en&&S.edit){const x=S.edit.draft[el.dataset.en];if(x)x.note=el.value;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MS.length)popModal();});

renderLogin();
})();
</script>
</body>
</html>
